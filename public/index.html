<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop the latest gadgets, cameras, smartphones, and accessories on our clean, minimalist e-commerce platform.">
  <title>KartVibe - Modern E-Commerce Platform</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/main.js"></script>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        KartVibe <span>Explore Plus</span>
      </a>
      <ul class="nav-links" id="nav-links">
        <!-- Dynamically rendered via main.js -->
        <li><a href="/">Home</a></li>
        <li><a href="/cart.html">Cart</a></li>
        <li><a href="/login.html">Login</a></li>
      </ul>
    </div>
  </header>

  <!-- Main Body Content -->
  <main class="container">
    <h1 class="home-title">Featured Products</h1>
    <div id="product-list" class="product-grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
        Loading featured products...
      </div>
    </div>

    <h2 class="home-title" style="margin-top: 48px;">Trending Products</h2>
    <div id="trending-list" class="product-grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
        Loading trending products...
      </div>
    </div>

    <h2 class="home-title" style="margin-top: 48px;">Top Sales / Offers</h2>
    <div id="offers-list" class="product-grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
        Loading special offers...
      </div>
    </div>
  </main>

</body>
</html>
