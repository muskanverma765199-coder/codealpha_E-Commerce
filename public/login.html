<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your KartVibe account using your email and password.">
  <title>Login - KartVibe</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/main.js"></script>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        KartVibe <span>Explore Plus</span>
      </a>
      <ul class="nav-links" id="nav-links">
        <!-- Dynamically rendered via main.js -->
        <li><a href="/">Home</a></li>
        <li><a href="/cart.html">Cart</a></li>
        <li><a href="/login.html">Login</a></li>
      </ul>
    </div>
  </header>

  <!-- Main Body Content -->
  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Log in to access your cart and complete checkout</p>
      </div>
      
      <form id="login-form">
        <!-- Error box inserted dynamically here if credentials invalid -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="enter your email..." required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-auth">Log In</button>
      </form>
      
      <div class="auth-footer">
        New to KartVibe? <a href="/register.html">Create an account</a>
      </div>
    </div>
  </main>

</body>
</html>
